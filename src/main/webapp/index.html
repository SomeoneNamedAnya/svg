<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Построение графиков в SVG</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --primary-soft: #eef2ff;
            --accent: #7c3aed;
            --background: #f4f6fb;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #dbe2ea;
            --danger: #dc2626;
            --warning: #b45309;
            --radius: 12px;
            --shadow: 0 10px 30px rgba(30, 41, 59, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            height: 100vh;
            height: 100dvh;
            min-width: 360px;
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
            margin: 0;
            color: var(--text);
            background: var(--background);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .site-header {
            display: flex;
            align-items: center;
            min-height: 104px;
            flex: 0 0 auto;
            padding: 22px clamp(20px, 4vw, 56px);
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 6px 24px rgba(55, 48, 163, 0.24);
        }

        .header-content {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .title-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 3vw, 34px);
            line-height: 1.15;
            letter-spacing: -0.02em;
        }

        .site-header p {
            margin: 8px 0 0;
            color: rgba(255, 255, 255, 0.82);
            font-size: 14px;
        }

        .app-layout {
            display: flex;
            align-items: stretch;
            min-height: 0;
            flex: 1 1 auto;
            overflow: hidden;
        }

        #panel {
            display: flex;
            width: 400px;
            min-height: 0;
            flex: 0 0 auto;
            flex-direction: column;
            overflow: hidden;
            padding: 18px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            box-shadow: 8px 0 24px rgba(30, 41, 59, 0.04);
            transition: width 0.25s ease, padding 0.25s ease;
        }

        .panel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 0 0 auto;
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel-heading {
            margin: 0;
            font-size: 18px;
        }

        #panelToggle {
            display: inline-grid;
            width: 38px;
            height: 38px;
            flex: 0 0 38px;
            place-items: center;
            padding: 0;
            border: 1px solid #c7d2fe;
            border-radius: 10px;
            color: var(--primary);
            background: var(--primary-soft);
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }

        #panelToggle:hover {
            color: #ffffff;
            background: var(--primary);
        }

        #panelToggle:focus-visible {
            outline: 3px solid rgba(79, 70, 229, 0.24);
            outline-offset: 2px;
        }

        #panel.collapsed {
            width: 58px;
            padding: 18px 10px;
        }

        #panel.collapsed .panel-heading,
        #panel.collapsed .panel-content {
            display: none;
        }

        #panel.collapsed .panel-top {
            justify-content: center;
            margin-bottom: 0;
        }

        .panel-content {
            display: flex;
            min-height: 0;
            flex: 1 1 auto;
            flex-direction: column;
            gap: 14px;
            overflow-x: hidden;
            overflow-y: auto;
            padding-right: 6px;
            scrollbar-gutter: stable;
        }

        .control-section {
            min-width: 0;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #ffffff;
        }

        .control-section h3 {
            margin: 0 0 12px;
            color: #334155;
            font-size: 13px;
            font-weight: 750;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .field {
            min-width: 0;
            margin-top: 10px;
        }

        .field:first-child {
            margin-top: 0;
        }

        label,
        .field-label {
            display: block;
            margin-bottom: 6px;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
        }

        input[type="text"],
        select {
            width: 100%;
            min-width: 0;
            height: 40px;
            padding: 0 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            color: var(--text);
            background: #ffffff;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:hover,
        select:hover {
            border-color: #a5b4fc;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            cursor: pointer;
        }

        input[type="range"] {
            width: 100%;
            margin: 4px 0 0;
            accent-color: var(--primary);
        }

        input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: var(--primary);
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .field-grid .field {
            margin-top: 0;
        }

        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #f8fafc;
            cursor: pointer;
        }

        .checkbox-card span {
            line-height: 1.25;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .toggle-row .checkbox-card {
            flex: 1 1 0;
            justify-content: center;
            white-space: nowrap;
        }

        fieldset {
            min-width: 0;
            margin: 12px 0 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: opacity 0.2s ease, background 0.2s ease;
        }

        fieldset legend {
            padding: 0 6px;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
        }

        fieldset:disabled {
            opacity: 0.58;
            background: #f1f5f9;
        }

        fieldset:disabled input {
            cursor: not-allowed;
        }

        .helper-text {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.4;
        }

        .error-text {
            min-height: 14px;
            margin-top: 4px;
            color: var(--danger);
            font-size: 12px;
        }

        .field-error {
            border-color: var(--danger) !important;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1) !important;
        }

        #hint {
            min-height: 16px;
            color: var(--warning);
            font-size: 13px;
            text-align: center;
        }

        .action-group {
            display: grid;
            gap: 9px;
        }

        .action-button {
            min-height: 43px;
            padding: 9px 16px;
            border-radius: 9px;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        .action-button:not(:disabled):hover {
            transform: translateY(-1px);
        }

        .action-button:disabled {
            cursor: not-allowed;
            opacity: 0.48;
        }

        .primary-button {
            border: 1px solid var(--primary);
            color: #ffffff;
            background: linear-gradient(120deg, var(--primary), var(--accent));
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.2);
        }

        .secondary-button {
            border: 1px solid #c7d2fe;
            color: var(--primary-dark);
            background: var(--primary-soft);
        }

        #graphArea {
            display: flex;
            min-width: 300px;
            min-height: 0;
            flex: 1 1 auto;
            overflow: hidden;
            padding: 0;
        }

        .graph-card {
            display: flex;
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            flex-direction: column;
            overflow: hidden;
            padding: 0;
            background: var(--surface);
        }

        #preview {
            display: grid;
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            overflow: hidden;
            place-items: center;
            background-color: #ffffff;
        }

        #preview svg {
            display: block;
            width: 100%;
            height: auto;
            background: rgba(255, 255, 255, 0.92);
        }

        #warnings {
            padding: 10px 2px 0;
            color: var(--warning);
            font-size: 13px;
        }

        #warnings:empty {
            display: none;
        }

        @media (max-width: 800px) {
            .site-header {
                min-height: auto;
                padding: 20px;
            }

            .app-layout {
                min-height: 0;
                flex-direction: column;
                position: relative;
            }

            #panel,
            #panel.collapsed {
                width: 100%;
                height: 100%;
                padding: 16px;
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }

            #panel {
                position: absolute;
                z-index: 2;
                inset: 0;
            }

            #panel.collapsed {
                height: 70px;
            }

            #panel.collapsed .panel-top {
                justify-content: flex-end;
            }

            #graphArea {
                width: 100%;
                min-width: 0;
                height: 100%;
            }

            #preview {
                min-height: 0;
            }
        }

        @media (max-width: 460px) {
            .title-row {
                align-items: flex-start;
            }

            .field-grid {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="header-content">
        <div class="title-row">
            <h1>Построение графиков</h1>
        </div>
        <p>Задайте функцию, настройте вид графика и экспортируйте результат в векторном формате</p>
    </div>
</header>

<main class="app-layout">
    <aside id="panel">
        <div class="panel-top">
            <h2 class="panel-heading">Настройки</h2>
            <button id="panelToggle" type="button" aria-controls="panel" aria-expanded="true"
                    aria-label="Свернуть панель" title="Свернуть панель">«</button>
        </div>

        <div class="panel-content">
            <section class="control-section">
                <h3>Функция</h3>

                <div class="field">
                    <label for="historySelect">История построений</label>
                    <select id="historySelect">
                        <option value="">Последние 5 конфигураций</option>
                    </select>
                </div>

                <div class="field">
                    <label for="modeSelect">Тип функции</label>
                    <select id="modeSelect">
                        <option value="EXPLICIT">Явная функция y = f(x)</option>
                        <option value="PARAMETRIC">Параметрическая: x = f(t), y = g(t)</option>
                    </select>
                </div>

                <div class="field">
                    <label id="fLabel" for="fField">f(x) =</label>
                    <input id="fField" type="text" placeholder="Например: sin(x)" autocomplete="off">
                    <div id="fError" class="error-text"></div>
                </div>

                <div class="field">
                    <label id="gLabel" for="gField" style="display:none">y = g(t)</label>
                    <input id="gField" type="text" placeholder="Например: sin(t)" autocomplete="off" style="display:none">
                    <div id="gError" class="error-text" style="display:none"></div>
                </div>
            </section>

            <section class="control-section">
                <h3>Диапазон и точность</h3>

                <div class="field-grid">
                    <div class="field">
                        <label id="rangeMinLabel" for="rangeMinField">x_min</label>
                        <input id="rangeMinField" type="text" value="-10">
                        <div id="rangeMinError" class="error-text"></div>
                    </div>
                    <div class="field">
                        <label id="rangeMaxLabel" for="rangeMaxField">x_max</label>
                        <input id="rangeMaxField" type="text" value="10">
                        <div id="rangeMaxError" class="error-text"></div>
                    </div>
                </div>

                <div class="field">
                    <label for="pointCountField">Число точек (100–5000)</label>
                    <input id="pointCountField" type="text" value="1000">
                </div>
            </section>

            <section class="control-section">
                <h3>Вид линии</h3>

                <div class="field-grid">
                    <div class="field">
                        <label for="colorField">Цвет линии</label>
                        <input id="colorField" type="color" value="#4f46e5">
                    </div>
                    <div class="field">
                        <label for="lineStyleSelect">Стиль</label>
                        <select id="lineStyleSelect">
                            <option value="SOLID">Сплошная</option>
                            <option value="DASHED">Пунктирная</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="strokeWidthField">Толщина: <span id="strokeWidthValue">2</span> px</label>
                    <input id="strokeWidthField" type="range" min="1" max="10" step="0.5" value="2">
                </div>
            </section>

            <section class="control-section">
                <h3>Область построения</h3>

                <label class="checkbox-card" for="autoScaleCheck">
                    <input id="autoScaleCheck" type="checkbox" checked>
                    <span>Автоматический масштаб</span>
                </label>

                <p id="viewBoxHint" class="helper-text">Отключите автоматический масштаб, чтобы ввести границы вручную.
                </p>

                <fieldset id="viewBoxFields" disabled>
                    <legend>Границы видимой области</legend>
                    <div class="field-grid">
                        <div class="field">
                            <label for="vbXMinField">X min</label>
                            <input id="vbXMinField" type="text" placeholder="-10">
                        </div>
                        <div class="field">
                            <label for="vbXMaxField">X max</label>
                            <input id="vbXMaxField" type="text" placeholder="10">
                        </div>
                        <div class="field">
                            <label for="vbYMinField">Y min</label>
                            <input id="vbYMinField" type="text" placeholder="-10">
                        </div>
                        <div class="field">
                            <label for="vbYMaxField">Y max</label>
                            <input id="vbYMaxField" type="text" placeholder="10">
                        </div>
                    </div>
                </fieldset>
            </section>

            <section class="control-section">
                <h3>Оси и сетка</h3>

                <div class="toggle-row">
                    <label class="checkbox-card" for="showAxesCheck">
                        <input id="showAxesCheck" type="checkbox" checked>
                        <span>Показывать оси</span>
                    </label>
                    <label class="checkbox-card" for="showGridCheck">
                        <input id="showGridCheck" type="checkbox" checked>
                        <span>Показывать сетку</span>
                    </label>
                </div>

                <div class="field-grid" style="margin-top: 12px">
                    <div class="field">
                        <label for="axisColorField">Цвет осей</label>
                        <input id="axisColorField" type="color" value="#334155">
                    </div>
                    <div class="field">
                        <label for="axisWidthField">Толщина: <span id="axisWidthValue">1.5</span> px</label>
                        <input id="axisWidthField" type="range" min="1" max="5" step="0.5" value="1.5">
                    </div>
                </div>
            </section>

            <div class="action-group">
                <button id="buildButton" class="action-button primary-button" disabled>Построить график</button>
                <div id="hint"></div>
                <button id="downloadButton" class="action-button secondary-button" disabled>Скачать SVG</button>
            </div>
        </div>
    </aside>

    <section id="graphArea" aria-label="Область просмотра графика">
        <div class="graph-card">
            <div id="preview"></div>
            <div id="warnings"></div>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
<script>
    main();

    const panel = document.getElementById('panel');
    const panelToggle = document.getElementById('panelToggle');
    const modeSelect = document.getElementById('modeSelect');
    const autoScaleCheck = document.getElementById('autoScaleCheck');
    const viewBoxFields = document.getElementById('viewBoxFields');
    const viewBoxHint = document.getElementById('viewBoxHint');
    const strokeWidthField = document.getElementById('strokeWidthField');
    const axisWidthField = document.getElementById('axisWidthField');

    panelToggle.addEventListener('click', () => {
        const collapsed = panel.classList.toggle('collapsed');
        const action = collapsed ? 'Развернуть панель' : 'Свернуть панель';

        panelToggle.textContent = collapsed ? '»' : '«';
        panelToggle.title = action;
        panelToggle.setAttribute('aria-label', action);
        panelToggle.setAttribute('aria-expanded', String(!collapsed));
    });

    function updateFunctionMode(resetRange) {
        const parametric = modeSelect.value === 'PARAMETRIC';
        const fLabel = document.getElementById('fLabel');
        const fField = document.getElementById('fField');
        const gLabel = document.getElementById('gLabel');
        const gField = document.getElementById('gField');
        const gError = document.getElementById('gError');
        const rangeMinLabel = document.getElementById('rangeMinLabel');
        const rangeMaxLabel = document.getElementById('rangeMaxLabel');

        fLabel.textContent = parametric ? 'x = f(t)' : 'f(x) =';
        fField.placeholder = parametric ? 'Например: cos(t)' : 'Например: sin(x)';
        gLabel.style.display = parametric ? '' : 'none';
        gField.style.display = parametric ? '' : 'none';
        gError.style.display = parametric ? '' : 'none';
        rangeMinLabel.textContent = parametric ? 't min' : 'x min';
        rangeMaxLabel.textContent = parametric ? 't max' : 'x max';

        if (resetRange) {
            document.getElementById('rangeMinField').value = parametric ? '0' : '-10';
            document.getElementById('rangeMaxField').value = parametric ? '2*pi' : '10';
        }
    }

    function updateViewBoxState() {
        const automatic = autoScaleCheck.checked;

        viewBoxFields.disabled = automatic;
        viewBoxHint.textContent = automatic
                ? 'Отключите автоматический масштаб, чтобы ввести границы вручную.'
                : 'Ручной режим: задайте минимальные и максимальные значения X и Y.';
    }

    function updateThicknessValues() {
        document.getElementById('strokeWidthValue').textContent = strokeWidthField.value;
        document.getElementById('axisWidthValue').textContent = axisWidthField.value;
    }

    modeSelect.addEventListener('change', () => updateFunctionMode(true));
    autoScaleCheck.addEventListener('change', updateViewBoxState);
    strokeWidthField.addEventListener('input', updateThicknessValues);
    axisWidthField.addEventListener('input', updateThicknessValues);
    document.getElementById('historySelect').addEventListener('change', () => {
        updateFunctionMode(false);
        updateViewBoxState();
        updateThicknessValues();
    });

    updateFunctionMode(false);
    updateViewBoxState();
    updateThicknessValues();
</script>
</body>
</html>
